name: iOS
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Start mock back office
        run: |
          cd testing/e2e-kit
          npm ci
          node src/cli/backoffice.ts --host 127.0.0.1 > "$RUNNER_TEMP/backoffice.log" 2>&1 &
      - name: Build XCTest
        run: xcodebuild build-for-testing -scheme BricksSoftCapacitorLocationTracking -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-unit-build" CODE_SIGNING_ALLOWED=NO
      - name: Select simulator
        run: python3 .github/scripts/ios-simulator.py
      - name: XCTest
        run: xcodebuild test-without-building -scheme BricksSoftCapacitorLocationTracking -derivedDataPath "$RUNNER_TEMP/ios-unit-build" -destination "platform=iOS Simulator,id=$IOS_SIMULATOR" -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-tests
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/backoffice.log
  package:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        manager: [SPM, CocoaPods]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Fresh tarball consumer
        run: node .github/scripts/ios-consumer.mjs ${{ matrix.manager }}
      - name: Build unsigned release
        run: |
          cd "$RUNNER_TEMP/ios-consumer/ios/App"
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/LTExample.xcarchive" archive CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/LTExample.xcarchive" archive CODE_SIGNING_ALLOWED=NO
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/LTExample.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/location-tracking-example-unsigned.ipa" Payload
      - name: Select simulator
        run: python3 .github/scripts/ios-simulator.py
      - name: Build simulator consumer
        run: |
          cd "$RUNNER_TEMP/ios-consumer/ios/App"
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/ios-simulator" build CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/ios-simulator" build CODE_SIGNING_ALLOWED=NO
          fi
      - name: WebView bridge and position smoke
        run: python3 .github/scripts/ios-smoke.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-bridge-${{ matrix.manager }}
          path: ${{ runner.temp }}/ios-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-example-unsigned-${{ matrix.manager }}
          path: ${{ runner.temp }}/location-tracking-example-unsigned.ipa
